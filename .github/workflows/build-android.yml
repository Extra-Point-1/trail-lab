name: Build Trail Lab for Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show working directory and project files
        run: |
          pwd
          ls -la
          echo "---"
          ls -la trail-lab/ 2>/dev/null || echo "no trail-lab subdir"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk wget unzip cmake ninja-build git curl zip xz-utils

      - name: Download Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip -O ndk.zip
          unzip -q ndk.zip
          echo "ANDROID_NDK_ROOT=$GITHUB_WORKSPACE/android-ndk-r25c" >> $GITHUB_ENV

      - name: Download Geode CLI
        run: |
          curl -L -s -o geode-cli.zip https://github.com/geode-sdk/cli/releases/download/v3.9.0/geode-cli-v3.9.0-linux.zip
          unzip -q geode-cli.zip
          chmod +x geode
          echo "$GITHUB_WORKSPACE" >> $GITHUB_PATH

      - name: Install Geode SDK binaries
        run: |
          geode sdk install-binaries -p android64 || true

      - name: Build mod for Android ARM64
        run: |
          # Handle nested checkout directory
          if [ -d trail-lab ]; then
            cd trail-lab
          fi
          pwd
          ls -la
          geode build -p android64

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trail-lab-android64
          path: |
            **/*.geode
            build-android64/*.geode
            trail-lab/**/*.geode
            trail-lab/build-android64/*.geode
